      <stop offset="0%" stop-color="#1e1c26"/>
      <stop offset="55%" stop-color="#101017"/>
      <stop offset="100%" stop-color="#07060a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#fdf0c8"/>
